<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie — Ogulniega</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101020, #20204a, #391b59);
      background-size: 200% 200%;
      animation: tlo 8s ease infinite;
      color: white;
      padding: 20px;
    }

    @keyframes tlo {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .panel {
      width: 100%;
      max-width: 390px;
      padding: 38px 30px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 22px;
      background: rgba(15, 15, 35, 0.88);
      box-shadow: 0 15px 60px rgba(0,0,0,0.35);
      text-align: center;
      animation: wejscie 0.7s ease;
    }

    @keyframes wejscie {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 36px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .opis {
      color: #b8b8d0;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .pole {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #e2e2f5;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #45456b;
      border-radius: 10px;
      background: #19192f;
      color: white;
      font-size: 15px;
      outline: none;
      transition: 0.25s;
    }

    input:focus {
      border-color: #a56bff;
      box-shadow: 0 0 0 3px rgba(165,107,255,0.15);
    }

    input::placeholder {
      color: #8585a5;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #8351ef, #bd55ec);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.98);
    }

    .sukces {
      font-size: 28px;
      font-weight: bold;
      color: #70f5a5;
      animation: wejscie 0.5s ease;
    }

    .ukryty {
      display: none;
    }

    @media (max-width: 420px) {
      .panel {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>

  <main class="panel">
    <section id="formularz">
      <div class="logo">✦</div>
      <h1>Ogulniega</h1>
      <p class="opis">Zaloguj się, aby kontynuować</p>

      <form id="logowanie">
        <div class="pole">
          <label for="email">Adres e-mail</label>
          <input
            type="email"
            id="email"
            placeholder="Wpisz swój e-mail"
            autocomplete="off"
            required
          >
        </div>

        <div class="pole">
          <label for="haslo">Hasło</label>
          <input
            type="text"
            id="haslo"
            placeholder="Wpisz swoje hasło"
            autocomplete="off"
            required
          >
        </div>

        <button type="submit">Zaloguj się</button>
      </form>
    </section>

    <section id="wynik" class="ukryty" aria-live="polite">
      <div class="sukces">Zalogowano</div>
    </section>
  </main>

  <script>
    const formularz = document.getElementById("logowanie");
    const panelFormularza = document.getElementById("formularz");
    const wynik = document.getElementById("wynik");

    formularz.addEventListener("submit", function(event) {
      event.preventDefault();

      panelFormularza.classList.add("ukryty");
      wynik.classList.remove("ukryty");
    });
  </script>

</body>
</html>
